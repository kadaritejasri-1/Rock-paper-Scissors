<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <h1>ROCK PAPER SCISSORS</h1>

        <button class="choice-btn rock" onclick="playGame('rock')">
            <img src="Rock.png" alt="Rock">
        </button>

        <button class="choice-btn paper" onclick="playGame('paper')">
            <img src="paper.png" alt="Paper">
        </button>

        <button class="choice-btn scissors" onclick="playGame('scissors')">
            <img src="scissors.png" alt="Scissors">
        </button>

        <p id="playerChoice"></p>
        <p id="computerChoice"></p>
        <p id="result"></p>

        <p id="score">You: 0 | Computer: 0</p>

        <button class="reset-btn" onclick="resetGame()">
            🔄 Reset Game
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
